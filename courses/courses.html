<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurslar — Edu Web</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="courses.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="top-nav">
        <div class="nav-left">
            <div class="logo-section">
                <i class="fas fa-graduation-cap"></i>
                <span>Edu Web</span>
            </div>
        </div>
        <div class="nav-right">
            <a href="../dashboard/dashboard.html" class="nav-link">
                <i class="fas fa-home"></i>
                <span>Dashboard</span>
            </a>
            <a href="../my-courses/my-courses.html" class="nav-link">
                <i class="fas fa-folder-open"></i>
                <span>Mening Kurslarim</span>
            </a>
            <div class="user-menu">
                <div class="user-avatar" id="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
            </div>
        </div>
    </nav>

    <div class="courses-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-book"></i> Filtrlar</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-filter="all">
                    <i class="fas fa-th"></i>
                    <span>Barcha Kurslar</span>
                </a>
                <a href="#" class="nav-item" data-filter="enrolled">
                    <i class="fas fa-check-circle"></i>
                    <span>Ro'yxatdan O'tilgan</span>
                </a>
                <a href="#" class="nav-item" data-filter="available">
                    <i class="fas fa-unlock"></i>
                    <span>Mavjud Kurslar</span>
                </a>
                <a href="../my-courses/my-courses.html" class="nav-item">
                    <i class="fas fa-folder-open"></i>
                    <span>Mening Kurslarim</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header Section -->
            <div class="page-header">
                <div class="header-content">
                    <h1>
                        <i class="fas fa-book-open"></i>
                        Barcha Kurslar
                    </h1>
                    <p>O'zingizga mos kursni tanlang va o'rganishni boshlang</p>
                </div>
                <div class="header-actions">
                    <button id="add-course-btn" class="btn-primary hidden">
                        <i class="fas fa-plus"></i>
                        Yangi Kurs Yaratish
                    </button>
                </div>
            </div>

            <!-- Search and Filter Bar -->
            <div class="search-filter-bar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-input" placeholder="Kurslarni qidirish...">
                </div>
                <div class="filter-badges">
                    <span class="badge-info" id="courses-count">0 kurs</span>
                </div>
            </div>

            <!-- Courses Grid -->
            <div class="courses-section">
                <div id="courses-list" class="courses-grid" aria-live="polite">
                    <div id="loading-message" class="loading-state">
                        <div class="spinner"></div>
                        <p>Kurslar yuklanmoqda...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Create Course Modal -->
    <div id="create-form-container" class="modal-overlay" aria-hidden="true">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fas fa-plus-circle"></i> Yangi Kurs Yaratish</h3>
                <button class="modal-close" id="cancel-create-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="create-course-form">
                <div class="form-row">
                    <label for="course-title">
                        <i class="fas fa-heading"></i> Kurs Nomi
                    </label>
                    <input id="course-title" type="text" placeholder="Masalan: Web Dasturlash Asoslari" required />
                </div>
                <div class="form-row">
                    <label for="course-description">
                        <i class="fas fa-align-left"></i> Qisqa Tavsifi
                    </label>
                    <textarea id="course-description" rows="4" placeholder="Kursni bir-ikki jumla bilan tushuntiring..." required></textarea>
                </div>
                <div class="form-row">
                    <label for="course-price">
                        <i class="fas fa-dollar-sign"></i> Narxi ($)
                    </label>
                    <input id="course-price" type="number" min="0" step="0.01" placeholder="0.00" required />
                </div>
                <div class="form-actions">
                    <button type="button" id="cancel-create-btn-2" class="btn-secondary">
                        <i class="fas fa-times"></i> Bekor Qilish
                    </button>
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-save"></i> Kursni Saqlash
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Course Modal -->
    <div id="edit-form-container" class="modal-overlay" aria-hidden="true">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fas fa-edit"></i> Kursni Tahrirlash</h3>
                <button class="modal-close" id="cancel-edit-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="edit-course-form">
                <input type="hidden" id="edit-course-id" />
                <div class="form-row">
                    <label for="edit-title">
                        <i class="fas fa-heading"></i> Kurs Nomi
                    </label>
                    <input id="edit-title" type="text" required />
                </div>
                <div class="form-row">
                    <label for="edit-description">
                        <i class="fas fa-align-left"></i> Tavsifi
                    </label>
                    <textarea id="edit-description" rows="4" required></textarea>
                </div>
                <div class="form-row">
                    <label for="edit-price">
                        <i class="fas fa-dollar-sign"></i> Narxi ($)
                    </label>
                    <input id="edit-price" type="number" min="0" step="0.01" required />
                </div>
                <div class="form-row">
                    <label for="edit-ispublished">
                        <i class="fas fa-globe"></i> Nashr Holati
                    </label>
                    <select id="edit-ispublished">
                        <option value="false">Yo'q (Qoralama)</option>
                        <option value="true">Ha (E'lon Qilish)</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" id="cancel-edit-btn-2" class="btn-secondary">
                        <i class="fas fa-times"></i> Bekor Qilish
                    </button>
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-save"></i> Yangilash
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../assets/js/main.js"></script>
    <script type="module" src="courses.js"></script>
</body>
</html>
