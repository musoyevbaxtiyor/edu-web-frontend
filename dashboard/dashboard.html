<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Shaxsiy Kabinet</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="top-nav">
        <div class="nav-left">
            <div class="logo-section">
                <i class="fas fa-graduation-cap"></i>
                <span>Edu Web</span>
            </div>
        </div>
        <div class="nav-right">
            <a href="../courses/courses.html" class="nav-link">
                <i class="fas fa-book"></i>
                <span>Kurslar</span>
            </a>
            <div class="user-menu" id="user-menu" style="cursor: pointer;">
                <div class="user-avatar" id="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <span class="username-text" id="top-username">Foydalanuvchi</span>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-th-large"></i> Menyu</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="../courses/courses.html" class="nav-item active">
                    <i class="fas fa-book-open"></i>
                    <span>Kurslar</span>
                </a>
                <a href="../my-courses/my-courses.html" class="nav-item">
                    <i class="fas fa-folder-open"></i>
                    <span>Mening Kurslarim</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-chart-line"></i>
                    <span>Statistika</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-bell"></i>
                    <span>Xabarlar</span>
                    <span class="badge">3</span>
                </a>
                <a href="../test/test.html" class="nav-item" id="test-nav-item">
                    <i class="fas fa-clipboard-question"></i>
                    <span>Test</span>
                </a>
                <a href="../test-management/test-management.html" class="nav-item" id="test-management-nav-item" style="display: none;">
                    <i class="fas fa-cog"></i>
                    <span>Test Boshqaruvi</span>
                </a>
                <a href="../profile/profile.html" class="nav-item">
                    <i class="fas fa-user-circle"></i>
                    <span>Profil</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-cog"></i>
                    <span>Sozlamalar</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Welcome Section -->
            <div class="welcome-section">
                <h1>Xush kelibsiz, <span id="welcome-name">Foydalanuvchi</span>!</h1>
                <p>Bugun nima o'rganamiz?</p>
            </div>

            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card stat-primary">
                    <div class="stat-icon">
                        <i class="fas fa-book"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="courses-count">0</h3>
                        <p>Faol Kurslar</p>
                    </div>
                </div>
                <div class="stat-card stat-success">
                    <div class="stat-icon">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="completed-count">0</h3>
                        <p>Tugallangan</p>
                    </div>
                </div>
                <div class="stat-card stat-warning">
                    <div class="stat-icon">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="progress-count">0%</h3>
                        <p>Umumiy Progress</p>
                    </div>
                </div>
                <div class="stat-card stat-info">
                    <div class="stat-icon">
                        <i class="fas fa-certificate"></i>
                    </div>
                    <div class="stat-content">
                        <h3 id="certificates-count">0</h3>
                        <p>Sertifikatlar</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="../assets/js/main.js"></script>
    <script type="module" src="dashboard.js"></script>
</body>
</html>
