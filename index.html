<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="Edu Web — zamonaviy onlayn ta'lim platformasi. Kurslar, darslar, testlar va real vaqtli baholash." />
    <title>Edu Web — Onlayn Ta'lim Platformasi</title>
    <script>
      // Mavzuni birinchi paintdan oldin o'rnatish (FOUC va "stuck transition" oldini oladi)
      (function () {
        try {
          var saved = localStorage.getItem('eduweb_theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
