<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Kurs Materiallari — Edu Web</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="lesson-view.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="top-nav">
        <div class="nav-left">
            <div class="logo-section">
                <i class="fas fa-graduation-cap"></i>
                <span>Edu Web</span>
            </div>
        </div>
        <div class="nav-right">
            <a href="../dashboard/dashboard.html" class="nav-link">
                <i class="fas fa-home"></i>
                <span>Dashboard</span>
            </a>
            <a href="../courses/courses.html" class="nav-link">
                <i class="fas fa-book"></i>
                <span>Barcha Kurslar</span>
            </a>
            <a href="../my-courses/my-courses.html" class="nav-link">
                <i class="fas fa-folder-open"></i>
                <span>Mening Kurslarim</span>
            </a>
            <div class="user-menu">
                <div class="user-avatar" id="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
            </div>
        </div>
    </nav>

    <div class="lesson-view-container">
        <!-- Sidebar - Lessons List -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>
                    <i class="fas fa-list"></i>
                    Darslar Ro'yxati
                </h2>
                <div class="course-title-badge" id="course-title-badge">
                    <i class="fas fa-book"></i>
                    <span id="course-title">Kurs Nomi</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <ul id="lesson-list" class="lesson-list">
                    <div id="lessons-loading" class="loading-state">
                        <div class="spinner-small"></div>
                        <p>Darslar yuklanmoqda...</p>
                    </div>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Lesson Header -->
            <div class="lesson-header">
                <div class="lesson-title-section">
                    <h1 id="lesson-title">
                        <i class="fas fa-play-circle"></i>
                        Dars Nomi
                    </h1>
                    <div class="lesson-meta">
                        <span class="lesson-order" id="lesson-order">Dars #1</span>
                        <span class="lesson-status" id="lesson-status">
                            <i class="fas fa-circle"></i>
                            Boshlanmagan
                        </span>
                    </div>
                </div>
            </div>

            <!-- Lesson Content -->
            <div class="lesson-content-wrapper">
                <div id="lesson-content" class="lesson-content">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>Kontent yuklanmoqda...</p>
                    </div>
                </div>

                <!-- Task Submission Box -->
                <div id="task-submission-box" class="task-submission-box" style="display: none;">
                    <div class="task-header">
                        <h3>
                            <i class="fas fa-tasks"></i>
                            Vazifani Topshirish
                        </h3>
                    </div>
                    <div class="task-form">
                        <div class="form-group">
                            <label for="task-solution">
                                <i class="fas fa-file-upload"></i>
                                Yechim Faylini Tanlang
                            </label>
                            <input type="file" id="task-solution" required>
                            <small>Ruxsat etilgan formatlar: PDF, DOC, DOCX, ZIP, RAR</small>
                        </div>
                        <div class="form-group">
                            <label for="submission-comment">
                                <i class="fas fa-comment"></i>
                                Izoh yoki GitHub Linki
                            </label>
                            <textarea id="submission-comment" rows="4" placeholder="Izoh yoki GitHub linkini kiriting..."></textarea>
                        </div>
                        <div class="form-actions">
                            <button id="submit-task-btn" class="btn-primary">
                                <i class="fas fa-paper-plane"></i>
                                Topshirish
                            </button>
                            <div id="submission-message" class="submission-message"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="lesson-view.js"></script>
</body>
</html>
