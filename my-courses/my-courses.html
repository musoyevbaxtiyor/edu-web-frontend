<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mening Kurslarim — Edu Web</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="my-courses.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="top-nav">
        <div class="nav-left">
            <div class="logo-section">
                <i class="fas fa-graduation-cap"></i>
                <span>Edu Web</span>
            </div>
        </div>
        <div class="nav-right">
            <a href="../dashboard/dashboard.html" class="nav-link">
                <i class="fas fa-home"></i>
                <span>Dashboard</span>
            </a>
            <a href="../courses/courses.html" class="nav-link">
                <i class="fas fa-book"></i>
                <span>Barcha Kurslar</span>
            </a>
            <div class="user-menu">
                <div class="user-avatar" id="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
            </div>
        </div>
    </nav>

    <div class="my-courses-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-folder-open"></i> Mening Kurslarim</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="../dashboard/dashboard.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </a>
                <a href="../courses/courses.html" class="nav-item">
                    <i class="fas fa-book"></i>
                    <span>Barcha Kurslar</span>
                </a>
                <a href="#" class="nav-item active">
                    <i class="fas fa-folder-open"></i>
                    <span>Mening Kurslarim</span>
                </a>
                <a href="../profile/profile.html" class="nav-item">
                    <i class="fas fa-user-circle"></i>
                    <span>Profil</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header Section -->
            <div class="page-header">
                <div class="header-content">
                    <h1>
                        <i class="fas fa-folder-open"></i>
                        Mening Kurslarim
                    </h1>
                    <p>Ro'yxatdan o'tgan kurslaringiz va progresslaringiz</p>
                </div>
                <div class="header-stats">
                    <div class="stat-badge">
                        <i class="fas fa-book"></i>
                        <span id="courses-count">0</span>
                        <span>Kurs</span>
                    </div>
                </div>
            </div>

            <!-- Courses Grid -->
            <div class="courses-section">
                <div id="loading-message" class="loading-state">
                    <div class="spinner"></div>
                    <p>Kurslar yuklanmoqda...</p>
                </div>
                <div id="my-courses-list" class="courses-grid" aria-live="polite"></div>
            </div>
        </main>
    </div>

    <script type="module" src="../assets/js/main.js"></script>
    <script type="module" src="my-courses.js"></script>
</body>
</html>
