<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - Shaxsiy Ma'lumotlar</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="top-nav">
        <div class="nav-left">
            <div class="logo-section">
                <i class="fas fa-graduation-cap"></i>
                <span>Edu Web</span>
            </div>
        </div>
        <div class="nav-right">
            <a href="../dashboard/dashboard.html" class="nav-link">
                <i class="fas fa-home"></i>
                <span>Dashboard</span>
            </a>
            <a href="../courses/courses.html" class="nav-link">
                <i class="fas fa-book"></i>
                <span>Kurslar</span>
            </a>
            <div class="user-menu" id="user-menu" style="cursor: pointer;">
                <div class="user-avatar" id="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <span class="username-text" id="top-username">Foydalanuvchi</span>
            </div>
        </div>
    </nav>

    <div class="profile-container">
        <!-- Profile Header Card -->
        <div class="profile-header-card">
            <div class="profile-cover">
                <div class="profile-avatar-wrapper">
                    <div class="profile-avatar" id="profile-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="status-indicator"></div>
                </div>
            </div>
            <div class="profile-header-content">
                <h1 id="profile-name">Foydalanuvchi</h1>
                <p id="profile-email">email@example.com</p>
                <div class="profile-badges">
                    <span class="role-badge" id="role-badge">Foydalanuvchi</span>
                </div>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading-message" class="loading-state">
            <div class="spinner"></div>
            <p>Ma'lumotlar yuklanmoqda...</p>
        </div>

        <!-- Profile Content -->
        <div id="profile-content" class="profile-content" style="display: none;">
            <!-- Shaxsiy Ma'lumotlar -->
            <div class="profile-section">
                <div class="section-header">
                    <h2>
                        <i class="fas fa-user"></i>
                        Shaxsiy Ma'lumotlar
                    </h2>
                    <button class="edit-btn" id="edit-profile-btn">
                        <i class="fas fa-edit"></i>
                        Tahrirlash
                    </button>
                </div>
                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-label">
                            <i class="fas fa-user"></i>
                            <span>To'liq Ism</span>
                        </div>
                        <div class="info-value" id="user-name">-</div>
                    </div>

                    <div class="info-item">
                        <div class="info-label">
                            <i class="fas fa-envelope"></i>
                            <span>Email Manzili</span>
                        </div>
                        <div class="info-value" id="user-email">-</div>
                    </div>

                    <div class="info-item">
                        <div class="info-label">
                            <i class="fas fa-phone"></i>
                            <span>Telefon Raqami</span>
                        </div>
                        <div class="info-value" id="user-phone">-</div>
                    </div>

                    <div class="info-item">
                        <div class="info-label">
                            <i class="fas fa-birthday-cake"></i>
                            <span>Yosh</span>
                        </div>
                        <div class="info-value" id="user-age">-</div>
                    </div>

                    <div class="info-item">
                        <div class="info-label">
                            <i class="fas fa-user-tag"></i>
                            <span>Lavozim</span>
                        </div>
                        <div class="info-value">
                            <span class="role-badge" id="user-role">-</span>
                        </div>
                    </div>

                    <div class="info-item">
                        <div class="info-label">
                            <i class="fas fa-id-card"></i>
                            <span>Foydalanuvchi ID</span>
                        </div>
                        <div class="info-value info-id" id="user-id">-</div>
                    </div>
                </div>
            </div>

            <!-- Tahrirlash Formasi (Yashirin) -->
            <div id="edit-form-section" class="profile-section" style="display: none;">
                <div class="section-header">
                    <h2>
                        <i class="fas fa-edit"></i>
                        Profilni Tahrirlash
                    </h2>
                    <button class="cancel-btn" id="cancel-edit-btn">
                        <i class="fas fa-times"></i>
                        Bekor qilish
                    </button>
                </div>
                <form id="edit-profile-form" class="edit-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="edit-name">
                                <i class="fas fa-user"></i>
                                To'liq Ism
                            </label>
                            <input type="text" id="edit-name" required>
                        </div>

                        <div class="form-group">
                            <label for="edit-email">
                                <i class="fas fa-envelope"></i>
                                Email Manzili
                            </label>
                            <input type="email" id="edit-email" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="edit-phone">
                                <i class="fas fa-phone"></i>
                                Telefon Raqami
                            </label>
                            <input type="tel" id="edit-phone">
                        </div>

                        <div class="form-group">
                            <label for="edit-age">
                                <i class="fas fa-birthday-cake"></i>
                                Yosh
                            </label>
                            <input type="number" id="edit-age" min="1" max="120">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">
                            <i class="fas fa-save"></i>
                            Saqlash
                        </button>
                        <button type="button" class="btn-secondary" id="cancel-save-btn">
                            <i class="fas fa-times"></i>
                            Bekor qilish
                        </button>
                    </div>
                </form>
            </div>

            <!-- Profil Amallari -->
            <div class="profile-section">
                <div class="section-header">
                    <h2>
                        <i class="fas fa-cog"></i>
                        Amallar
                    </h2>
                </div>
                <div class="actions-grid">
                    <button class="action-btn action-primary" onclick="window.location.href='../dashboard/dashboard.html'">
                        <i class="fas fa-home"></i>
                        <span>Dashboard</span>
                    </button>
                    <button class="action-btn action-success" onclick="window.location.href='../courses/courses.html'">
                        <i class="fas fa-book"></i>
                        <span>Kurslar</span>
                    </button>
                    <button class="action-btn action-info" onclick="window.location.href='../my-courses/my-courses.html'">
                        <i class="fas fa-folder-open"></i>
                        <span>Mening Kurslarim</span>
                    </button>
                    <button class="action-btn action-danger" id="logout-btn">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Tizimdan Chiqish</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../assets/js/main.js"></script>
    <script type="module" src="profile.js"></script>
</body>
</html>
