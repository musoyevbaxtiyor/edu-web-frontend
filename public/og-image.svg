<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141d33"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo -->
  <g transform="translate(96,120)">
    <rect width="104" height="104" rx="26" fill="url(#brand)"/>
    <path d="M52 24 L84 40 L52 56 L20 40 Z" fill="#fff"/>
    <path d="M32 48 L32 66 C32 72 42 77 52 77 C62 77 72 72 72 66 L72 48 L52 58 Z" fill="#fff" opacity="0.85"/>
    <rect x="80" y="40" width="4" height="22" rx="2" fill="#fff"/>
  </g>

  <!-- Brand name -->
  <text x="232" y="196" font-size="64" font-weight="800" fill="#ffffff">Edu<tspan fill="#a78bfa">Web</tspan></text>

  <!-- Headline -->
  <text x="96" y="330" font-size="72" font-weight="800" fill="#ffffff">Onlayn ta'lim platformasi</text>
  <text x="96" y="410" font-size="34" font-weight="500" fill="#94a3b8">Dasturlash, HTML, CSS, JavaScript va Figma kurslari —</text>
  <text x="96" y="454" font-size="34" font-weight="500" fill="#94a3b8">amaliy vazifalar, testlar va real vaqtli baholash.</text>

  <!-- Chips -->
  <g transform="translate(96,516)" font-size="26" font-weight="600">
    <g>
      <rect width="180" height="54" rx="27" fill="#6366f1" opacity="0.16"/>
      <text x="90" y="35" text-anchor="middle" fill="#a5b4fc">Video darslar</text>
    </g>
    <g transform="translate(200,0)">
      <rect width="210" height="54" rx="27" fill="#10b981" opacity="0.16"/>
      <text x="105" y="35" text-anchor="middle" fill="#34d399">Amaliy vazifalar</text>
    </g>
    <g transform="translate(430,0)">
      <rect width="240" height="54" rx="27" fill="#f59e0b" opacity="0.16"/>
      <text x="120" y="35" text-anchor="middle" fill="#fbbf24">Reyting va sertifikat</text>
    </g>
  </g>

  <!-- Domain -->
  <text x="1104" y="574" text-anchor="end" font-size="30" font-weight="700" fill="#a78bfa">eduweb.uz</text>
</svg>
