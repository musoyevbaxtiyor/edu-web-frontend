<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan O'tish — Edu Web</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="top-nav">
        <div class="nav-left">
            <div class="logo-section">
                <i class="fas fa-graduation-cap"></i>
                <span>Edu Web</span>
            </div>
        </div>
        <div class="nav-right">
            <a href="../index.html" class="nav-link">
                <i class="fas fa-home"></i>
                <span>Bosh Sahifa</span>
            </a>
            <a href="../login/login.html" class="nav-link">
                <i class="fas fa-sign-in-alt"></i>
                <span>Kirish</span>
            </a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1>Yangi Hisob Yaratish</h1>
                <p>Edu Web platformasiga qo'shiling va o'rganishni boshlang</p>
            </div>

            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="name">
                        <i class="fas fa-user"></i>
                        To'liq Ism
                    </label>
                    <input type="text" id="name" placeholder="Masalan: Alisher Navoiy" required>
                </div>

                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i>
                        Email Manzili
                    </label>
                    <input type="email" id="email" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">
                        <i class="fas fa-phone"></i>
                        Telefon Raqami
                    </label>
                    <input type="tel" id="phone" placeholder="+998901234567" required>
                </div>

                <div class="form-group">
                    <label for="age">
                        <i class="fas fa-birthday-cake"></i>
                        Yoshingiz
                    </label>
                    <input type="number" id="age" placeholder="Masalan: 20" min="14" max="100" required>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Parol
                    </label>
                    <input type="password" id="password" placeholder="Kuchli parol kiriting" required>
                    <small>Parol kamida 6 belgidan iborat bo'lishi kerak</small>
                </div>

                <button type="submit" id="register-btn" class="btn-primary">
                    <i class="fas fa-user-plus"></i>
                    Ro'yxatdan O'tish
                </button>
            </form>

            <div class="auth-footer">
                <p>
                    Allaqachon hisobingiz bormi? 
                    <a href="../login/login.html">
                        <i class="fas fa-sign-in-alt"></i>
                        Kirish
                    </a>
                </p>
            </div>
        </div>
    </div>

    <script type="module" src="../assets/js/main.js"></script>
    <script type="module" src="register.js"></script>
</body>
</html>
