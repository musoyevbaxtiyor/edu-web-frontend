<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'qituvchi Paneli - Vazifalar</title>
    <link rel="stylesheet" href="teacher-panel.css">
</head>
<body>
    <header>
        <h2>O'qituvchi Paneli</h2>
        <div id="teacher-info">
            <i class="fas fa-user-circle"></i>
            <span>Yuklanmoqda...</span>
        </div>
    </header>
    
    <main>
        <h3>Tekshirilmagan Vazifalar (<span id="submission-count">0</span>)</h3>
        
        <div id="submissions-list-container">
            <!-- Vazifalar bu yerda ko'rsatiladi -->
        </div>

        <div id="feedback-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h4>Vazifani Baholash</h4>
                <p><strong>Dars:</strong> <span id="modal-lesson-title"></span></p>
                <p><strong>Talaba:</strong> <span id="modal-student-name"></span></p>
                
                <div id="modal-submission-text" class="submission-text-area">
                    <!-- Topshirilgan fayl va izohlar bu yerda ko'rsatiladi -->
                </div>
                
                <label for="grade-input">Baho (0-100):</label>
                <input type="number" id="grade-input" min="0" max="100" value="100">
                
                <label for="feedback-input">Fikr (Feedback):</label>
                <textarea id="feedback-input" placeholder="Talaba uchun fikr yozing..."></textarea>
                
                <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
                    <button id="approve-btn">
                        <i class="fas fa-check"></i> Tasdiqlash va Baholash
                    </button>
                    <button id="reject-btn">
                        <i class="fas fa-times"></i> Rad Etish
                    </button>
                    <button id="close-modal-btn">
                        <i class="fas fa-times-circle"></i> Yopish
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="../assets/js/main.js"></script>
    <script type="module" src="teacher-panel.js"></script>
</body>
</html>
